name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run API integration tests
        run: npm test

      - name: Validate NAS Compose
        run: docker compose --env-file .env.example -f compose.nas.yaml config --quiet

      - name: Build Docker image
        run: docker build --tag folio:ci .
