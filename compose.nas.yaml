services:
  folio:
    image: ghcr.io/yuris99/folio:latest
    container_name: folio
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4173
      FOLIO_DATA_DIR: /data
      APP_ORIGIN: "${APP_ORIGIN}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI}"
      AI_PROVIDER: "${AI_PROVIDER:-gemini}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_DEFAULT_MODEL: "${GEMINI_DEFAULT_MODEL:-gemini-3.6-flash}"
      GEMINI_EXTRACTION_MODEL: "${GEMINI_EXTRACTION_MODEL:-gemini-3.5-flash-lite}"
      GEMINI_WRITING_MODEL: "${GEMINI_WRITING_MODEL:-gemini-3.5-flash}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5.4-mini}"
    volumes:
      - "${FOLIO_DATA_PATH:-./nas-data}:/data"
    expose:
      - "4173"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4173/api/v1/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: folio-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN}"
    depends_on:
      - folio
